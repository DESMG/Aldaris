name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # actions/setup-node v7.0.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: package-lock.json
          token: ''

      - name: Install and build
        run: |
          node --version
          npm --version
          npm ci --ignore-scripts --no-audit --no-fund --engine-strict
          npm run build --ignore-scripts

      - name: Prepare database, migrate and deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          databases=$(./node_modules/.bin/wrangler d1 list --json --config wrangler.jsonc)
          database_exists=$(jq -r 'any(.[]; .name == "aldaris")' <<< "$databases")
          if [ "$database_exists" = false ]; then
            ./node_modules/.bin/wrangler d1 create aldaris --update-config=false --config wrangler.jsonc
          fi
          ./node_modules/.bin/wrangler d1 migrations apply DB --remote --config wrangler.jsonc
          ./node_modules/.bin/wrangler deploy
